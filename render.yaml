services:
  - type: web
    name: coursespace
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CHAPA_MODE
        value: test
      - key: CHAPA_CURRENCY
        value: ETB
